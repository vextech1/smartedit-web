name: Web CI

on:
  push:
    branches-ignore: [main]   # main is built, tested and deployed by web-deploy.yml
  pull_request:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - name: Type check
        run: npx svelte-check --tsconfig ./tsconfig.json
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
